services:
  - type: web
    name: vami
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GNANI_API_KEY_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
